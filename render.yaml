services:
  - type: web
    name: luxury-cyber-browser
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ACCESS_CODE
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BROWSER_DATA_DIR
        value: /tmp/chromium
